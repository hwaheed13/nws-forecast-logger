name: DSM Endpoint Comparison Test

# Schedule removed 2026-07-25 audit: this diagnostic ran daily for months
# uploading artifacts nobody consumed. Manual trigger kept for debugging
# DSM endpoints when needed.
on:
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-dsm-endpoints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Test DSM endpoints and store results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/test-dsm-endpoints.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsm-test-results
          path: dsm-test-results.json
          retention-days: 30

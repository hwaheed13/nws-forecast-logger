name: Golden Tests

# Renovation Phase 1 safety net: freezes current behavior of scoring, bucket
# probabilities, and model wiring. Every refactor phase must keep these green;
# changing a golden requires its own commit with a reason.
#
# [skip ci] commits (bot CSV/model updates) don't trigger this — only real
# code pushes and PRs do.

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "*.json"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "*.json"
  workflow_dispatch: {}

concurrency:
  group: golden-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.3 pandas==2.2.3 scikit-learn==1.3.0 requests beautifulsoup4 pytz pytest

      - name: Run golden tests
        run: python -m pytest tests/ -q

  notify-failure:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/refresh failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Workflow failed: ${context.workflow}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nFailed at: ${new Date().toISOString()}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'workflow-failure'
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['workflow-failure'] });
            }
